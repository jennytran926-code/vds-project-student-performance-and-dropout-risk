[project]
name = "dropout-dashboard"
version = "0.1.0"
description = "Interactive dashboard on student dropout risk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=3.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=6.0",
    "pywebview>=5.0",
]

[dependency-groups]
dev = ["pyinstaller>=6.10"]

[tool.uv]
package = false  # plain scripts in src/, nothing to install
